name: studentplanner
description: StudyMate - Student Planner, Attendance & GPA Tracker
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.5.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  go_router: ^14.8.1
  shared_preferences: ^2.5.3
  intl: ^0.20.2
  sqflite: ^2.4.2
  path: ^1.9.1
  uuid: ^4.5.1
  flutter_local_notifications: ^19.4.0
  timezone: ^0.10.1
  file_selector: ^1.1.0
  archive: ^4.0.7
  pdf: 3.11.3
  printing: ^5.14.3
  open_filex: ^4.7.0
  package_info_plus: ^10.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/branding/studymate-mark-source.png
